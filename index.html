<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tactical Command Task Dashboard</title>

<!-- Font Orbitron & Plus Jakarta Sans & JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

:root {
  --neon-green: #00ff9d;
  --neon-cyan: #00f0ff;
  --neon-gold: #ffbe0b;
  --neon-red: #ff0055;
  --bg-dark: #050a0e;
  --panel-bg: rgba(10, 20, 26, 0.75);
  --border-tactical: rgba(0, 255, 157, 0.25);
}

html, body {
  width: 100%; height: 100%; height: 100vh; height: 100dvh;
  overflow: hidden; background: var(--bg-dark); color: #e2e8f0;
}

body {
  display: flex; flex-direction: column; position: relative;
  background-image: 
    linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px),
    radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
    radial-gradient(circle at 80% 80%, rgba(0, 255, 157, 0.05) 0%, transparent 50%);
  background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%;
}

/* HEADER TACTICAL EDIT */
header {
  background: rgba(6, 14, 19, 0.9);
  backdrop-filter: blur(16px);
  padding: 12px 36px; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 2px solid var(--border-tactical);
  box-shadow: 0 4px 35px rgba(0, 0, 0, 0.9), 0 1px 15px rgba(0, 255, 157, 0.15);
  z-index: 10; flex-shrink: 0;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 20px) 100%, 0 100%);
}

.header-left-group {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo-title h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.5rem; font-weight: 900; letter-spacing: 2px;
  color: var(--neon-green);
  text-transform: uppercase;
  text-shadow: 0 0 12px rgba(0, 255, 157, 0.6), 0 0 25px rgba(0, 255, 157, 0.3);
  display: flex; align-items: center; gap: 10px;
}

.logo-title h1::before {
  content: "◈";
  color: var(--neon-cyan);
  text-shadow: 0 0 10px var(--neon-cyan);
}

.logo-title p { 
  color: #64748b; font-size: 0.75rem; margin-top: 2px; font-weight: 700; 
  letter-spacing: 2px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
}

.datetime-container {
  text-align: center; background: rgba(10, 25, 34, 0.8); padding: 6px 18px;
  border-radius: 6px; border: 1px solid var(--border-tactical); 
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: inset 0 0 15px rgba(0, 255, 157, 0.05), 0 0 10px rgba(0, 0, 0, 0.5);
}

#clock {
  font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 800;
  color: var(--neon-cyan); line-height: 1; text-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
}

#date { font-size: 0.7rem; color: #94a3b8; margin-top: 3px; font-weight: 700; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; }

.btn-setting {
  background: rgba(0, 255, 157, 0.1);
  color: var(--neon-green); border: 1px solid var(--neon-green); padding: 12px 24px;
  border-radius: 4px; cursor: pointer; font-weight: 800; font-size: 0.85rem;
  letter-spacing: 1.5px; text-transform: uppercase; font-family: 'Orbitron', sans-serif;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}

.btn-setting:hover { 
  background: var(--neon-green); color: #050a0e;
  box-shadow: 0 0 25px rgba(0, 255, 157, 0.7);
  transform: translateY(-2px);
}

/* MAIN AREA */
main { 
  flex: 1; padding: 24px 36px; display: flex; flex-direction: column; 
  z-index: 1; overflow: hidden; height: calc(100% - 90px);
}

.table-container {
  width: 100%; height: 100%; background: var(--panel-bg);
  border-radius: 8px; overflow-y: auto; 
  border: 1px solid var(--border-tactical);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 255, 157, 0.03);
  backdrop-filter: blur(12px);
}

.table-container::-webkit-scrollbar { width: 6px; }
.table-container::-webkit-scrollbar-track { background: rgba(5, 10, 14, 0.8); }
.table-container::-webkit-scrollbar-thumb { background: rgba(0, 255, 157, 0.3); border-radius: 3px; }
.table-container::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }

th {
  position: sticky; top: 0; z-index: 5; 
  background: #081219; color: var(--neon-cyan);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.75rem; font-weight: 800; padding: 18px 12px; 
  letter-spacing: 2px; text-transform: uppercase;
  border-bottom: 2px solid var(--neon-cyan); text-align: center;
  text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
}

td {
  padding: 16px 12px; font-size: 0.92rem; color: #cbd5e1;
  border-bottom: 1px solid rgba(0, 255, 157, 0.08); 
  vertical-align: middle; text-align: center;
  transition: all 0.2s;
}

tr:nth-child(even) { background-color: rgba(0, 255, 157, 0.015); }
tr:hover td { background: rgba(0, 240, 255, 0.05); color: #ffffff; }

.col-no { width: 4%; font-weight: 800; color: #475569; font-family: 'JetBrains Mono', monospace; }
.col-tgl { width: 8%; font-weight: 700; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
.col-jam { width: 8%; font-weight: 700; color: var(--neon-gold); font-family: 'JetBrains Mono', monospace; text-shadow: 0 0 8px rgba(255, 190, 11, 0.3); }

/* TEKS TUGAS CENTER */
.col-tugas { 
  width: 23%; 
  font-weight: 800; 
  color: #ffffff; 
  text-align: center; 
  letter-spacing: 0.3px; 
}

.col-penting { width: 8%; }
.col-jenis { width: 10%; font-size: 0.8rem; letter-spacing: 1px; font-family: 'Orbitron', sans-serif; }
.col-st-akan { width: 9%; }
.col-st-sedang { width: 9%; }
.col-st-selesai { width: 9%; }
.col-ket { width: 13%; text-align: left; color: #94a3b8; font-weight: 600; font-size: 0.88rem; }
.col-action { width: 5%; }

/* CHECKBOX STYLES */
.chk-container {
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; user-select: none;
}

.chk-container input { display: none; }

.checkmark {
  width: 22px; height: 22px; border-radius: 3px;
  border: 1.5px solid #1e293b; background: #060e13;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.chk-container:hover .checkmark { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }

.checkmark:after {
  content: ""; display: none; width: 5px; height: 9px;
  border: solid #050a0e; border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg); margin-bottom: 2px;
}

.chk-container input:checked + .checkmark:after { display: block; }

.chk-penting input:checked + .checkmark { 
  background: var(--neon-red); border-color: #ff3377; 
  box-shadow: 0 0 15px var(--neon-red); 
}

.chk-akan input:checked + .checkmark { 
  background: var(--neon-gold); border-color: #ffcc00; 
  box-shadow: 0 0 15px var(--neon-gold); 
}

.chk-sedang input:checked + .checkmark { 
  background: var(--neon-cyan); border-color: #33f3ff; 
  box-shadow: 0 0 18px var(--neon-cyan); 
  animation: pulse-glow-cyan 1.8s infinite; 
}

.chk-selesai input:checked + .checkmark { 
  background: var(--neon-green); border-color: #33ffad; 
  box-shadow: 0 0 15px var(--neon-green); 
}

@keyframes pulse-glow-cyan {
  0% { box-shadow: 0 0 5px rgba(0, 240, 255, 0.4); }
  50% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.9); }
  100% { box-shadow: 0 0 5px rgba(0, 240, 255, 0.4); }
}

.btn-action-group { display: flex; gap: 6px; justify-content: center; }
.btn-icon {
  background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-tactical); border-radius: 4px;
  width: 30px; height: 30px; display: flex; justify-content: center; align-items: center;
  cursor: pointer; color: #94a3b8; fill: currentColor; transition: all 0.2s;
}
.btn-icon svg { width: 14px; height: 14px; }
.btn-edit:hover { background: var(--neon-gold); color: #050a0e; border-color: var(--neon-gold); box-shadow: 0 0 10px var(--neon-gold); }
.btn-delete:hover { background: var(--neon-red); color: #fff; border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }
.btn-save { background: var(--neon-green); color: #050a0e; border-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

.edit-input, .edit-select, .edit-date {
  background: #060e13; border: 1px solid var(--neon-cyan); color: #f8fafc;
  padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; width: 100%; font-weight: 700; text-align: center;
}

/* MODAL STYLING */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
  background: rgba(4, 8, 12, 0.9); backdrop-filter: blur(14px); 
  display: flex; justify-content: center; align-items: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
  background: #081219; width: 90%; max-width: 500px; border-radius: 6px;
  border: 1.5px solid var(--neon-green); padding: 30px; 
  display: flex; flex-direction: column;
  box-shadow: 0 0 40px rgba(0, 255, 157, 0.25), inset 0 0 15px rgba(0, 255, 157, 0.05);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
}

.modal-header { 
  display: flex; justify-content: space-between; align-items: center; 
  margin-bottom: 22px; border-bottom: 1px solid var(--border-tactical); 
  padding-bottom: 12px; 
}
.modal-header h2 { 
  font-family: 'Orbitron', sans-serif;
  font-size: 1.1rem; color: var(--neon-green); font-weight: 800; 
  letter-spacing: 1.5px; text-transform: uppercase;
  text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
}
.btn-close { background: none; border: none; color: #64748b; font-size: 1.4rem; cursor: pointer; }
.btn-close:hover { color: var(--neon-red); }

.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; text-align: left; }
.form-group label { font-size: 0.72rem; color: var(--neon-cyan); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; font-family: 'Orbitron', sans-serif; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.form-group input, .form-group select {
  background: #050a0e; border: 1px solid var(--border-tactical); color: #f8fafc;
  padding: 12px 14px; border-radius: 4px; font-size: 0.9rem; width: 100%; font-weight: 700;
  transition: all 0.2s;
}
.form-group input:focus, .form-group select:focus {
  outline: none; border-color: var(--neon-green); box-shadow: 0 0 12px rgba(0, 255, 157, 0.4);
}

.btn-add {
  background: transparent;
  color: var(--neon-green); border: 1.5px solid var(--neon-green); padding: 14px; border-radius: 4px;
  font-weight: 800; cursor: pointer; font-size: 0.9rem; margin-top: 10px;
  letter-spacing: 1.5px; text-transform: uppercase; font-family: 'Orbitron', sans-serif;
  transition: all 0.2s; box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
}
.btn-add:hover { 
  background: var(--neon-green); color: #050a0e;
  box-shadow: 0 0 25px rgba(0, 255, 157, 0.7); 
}

#tizenAudioUnlocker {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #050a0e; z-index: 99999; display: flex; flex-direction: column;
  justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
  background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 157, 0.1) 0%, transparent 70%);
}
</style>

<body>

<div id="tizenAudioUnlocker">
  <h1 style="font-family: 'Orbitron', sans-serif; font-size: 2.2rem; margin-bottom: 12px; color: var(--neon-green); font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 20px rgba(0, 255, 157, 0.6);">TACTICAL COMMAND SYSTEM</h1>
  <p style="font-size: 0.95rem; margin-bottom: 35px; color: #64748b; max-width: 480px; font-weight: 700; font-family: 'JetBrains Mono', monospace;">INITIALIZING OPERATIONAL TACTICAL INTERFACE...</p>
  <button onclick="bukaKunciAudio()" style="font-family: 'Orbitron', sans-serif; padding: 18px 40px; font-size: 1rem; font-weight: 800; letter-spacing: 2px; background: transparent; color: var(--neon-green); border: 2px solid var(--neon-green); border-radius: 4px; cursor: pointer; box-shadow: 0 0 30px rgba(0, 255, 157, 0.4); transition: all 0.3s;">

<header>

    <div class="datetime-container">

      <div id="date">MEMUAT...</div>

<main>

      </tbody>

<div class="modal-overlay" id="settingModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>＋ TAMBAH TUGAS BARU</h2>
      <button class="btn-close" onclick="toggleModal(false)">✕</button>

      <div class="form-group">
        <label for="inputPenting">Prioritas:</label>
        <select id="inputPenting">
          <option value="tidak">Biasa</option>
          <option value="ya">Penting / Urgent</option>

        <label for="inputJenis">Kategori Tugas:</label>

      <input type="text" id="inputKeterangan" placeholder="Penanggung Jawab / Posko / Lokasi">
    </div>

    <button class="btn-add" onclick="addNewTask()">✔ SIMPAN TASK</button>

<script>
const dbURL = "https://api.npoint.io/c8f2e46b1d935402179a";

let systemTasks = [];
let editingRowIndex = -1;
let audioCtx = null;
let isSaving = false;

const iconPencil = '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
const iconTrash = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
const iconSave = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

function initAudioEngine() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function bukaKunciAudio() {
  initAudioEngine();
  document.getElementById('tizenAudioUnlocker').style.display = 'none';
  playChimeNotification([523.25, 659.25, 783.99]);
}

function playTone(freq, type, duration, delay = 0) {
  initAudioEngine();
  if (!audioCtx) return;
  setTimeout(() => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { console.error(e); }
  }, delay);
}

function playChimeNotification(freqs = [440, 554.37, 659.25]) {
  freqs.forEach((f, i) => playTone(f, 'sine', 0.6, i * 150));
}

function panggilSuaraAI(teks) {
  playChimeNotification([523.25, 659.25, 783.99, 1046.50]);
  setTimeout(() => {
    try {
      const existingAudio = document.getElementById('audioTTS');
      if (existingAudio) existingAudio.remove();

      const encodedText = encodeURIComponent(teks);
      const ttsUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + encodedText + '&tl=id&client=tw-ob';

      const audio = new Audio(ttsUrl);
      audio.id = 'audioTTS';
      audio.playbackRate = 0.95;
      audio.play().catch(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const speech = new SpeechSynthesisUtterance(teks);
          speech.lang = 'id-ID';
          speech.pitch = 1.0;
          window.speechSynthesis.speak(speech);
        }
      });
    } catch (e) { console.error("Gagal suara TTS:", e); }
  }, 800);
}

function updateDateTime() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = hours + ':' + minutes;
  document.getElementById('date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

async function saveData() {
  isSaving = true;
  localStorage.setItem('korpasgat_tasks_data', JSON.stringify(systemTasks));

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);

  try {
    const response = await fetch(dbURL, {
      method: 'POST',
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(systemTasks),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (response.ok) {
      console.log("Berhasil tersinkron ke cloud!");
    }
  } catch (e) {
    console.warn("Koneksi cloud timeout, data tersimpan aman di lokal:", e);
  } finally {
    isSaving = false;
  }
}

async function loadData() {
  if (editingRowIndex !== -1 || isSaving) return;

  const localData = localStorage.getItem('korpasgat_tasks_data');
  if (localData) {
    try {
      const parsedLocal = JSON.parse(localData);
      if (Array.isArray(parsedLocal) && parsedLocal.length > 0) {
        systemTasks = parsedLocal;
        renderTasks(false);
      }
    } catch (e) { console.error("Gagal parse localData", e); }
  }

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);

  try {
    const response = await fetch(dbURL + '?_=' + new Date().getTime(), { signal: controller.signal });
    clearTimeout(timeoutId);
    if (response.ok) {
      const cloudData = await response.json();
      if (Array.isArray(cloudData)) {
        systemTasks = cloudData;
        localStorage.setItem('korpasgat_tasks_data', JSON.stringify(systemTasks));
        renderTasks(false);
      }
    }
  } catch (e) {
    console.warn("Gagal terhubung ke cloud server, menggunakan lokal data.");
    if (systemTasks.length === 0) renderTasks(false);
  }
}

function formatTanggalSimple(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function renderTasks(triggerSave = true) {
  const tbody = document.getElementById('main-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (systemTasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: #64748b; font-weight: bold; padding: 40px; font-family: \'JetBrains Mono\', monospace;">SYSTEM READY. DATABASE KOSONG. KLIK + TAMBAH TUGAS.</td></tr>';
    if (triggerSave) saveData();
    return;
  }

  systemTasks.forEach((item, index) => {
    if (!item.status) item.status = 'AKAN';
    if (item.isPenting === undefined) item.isPenting = false;
    if (!item.jenis) item.jenis = 'Rutin';

    const tr = document.createElement('tr');
    tr.setAttribute('id', 'row-' + index);

    if (editingRowIndex === index) {
      tr.innerHTML = 
        '<td class="col-no">' + (index + 1) + '</td>' +
        '<td class="col-tgl"><input type="date" class="edit-date" id="edit-tgl" value="' + item.tgl + '"></td>' +
        '<td class="col-jam"><input type="time" class="edit-input" id="edit-jam" value="' + (item.jam || '08:00') + '"></td>' +
        '<td class="col-tugas"><input type="text" class="edit-input" id="edit-tugas" value="' + item.tugas + '"></td>' +
        '<td class="col-penting">' +
          '<select id="edit-penting" class="edit-select"><option value="ya" ' + (item.isPenting ? 'selected' : '') + '>Ya</option><option value="tidak" ' + (!item.isPenting ? 'selected' : '') + '>Tidak</option></select>' +
        '</td>' +
        '<td class="col-jenis">' +
          '<select id="edit-jenis" class="edit-select"><option value="Rutin" ' + (item.jenis === 'Rutin' ? 'selected' : '') + '>Rutin</option><option value="Tambahan" ' + (item.jenis === 'Tambahan' ? 'selected' : '') + '>Tambahan</option></select>' +
        '</td>' +
        '<td colspan="3"><span style="color:var(--neon-cyan); font-weight:bold; font-size:0.8rem; font-family:\'Orbitron\', sans-serif;">EDITING...</span></td>' +
        '<td class="col-ket"><input type="text" class="edit-input" id="edit-keterangan" value="' + (item.keterangan || '') + '"></td>' +
        '<td class="col-action">' +
          '<div class="btn-action-group">' +
            '<button class="btn-icon btn-save" onclick="saveInlineEdit(' + index + ')" title="Simpan">' + iconSave + '</button>' +
          '</div>' +
        '</td>';
    } else {
      let displayTgl = formatTanggalSimple(item.tgl);

      tr.innerHTML = 
        '<td class="col-no">' + (index + 1) + '</td>' +
        '<td class="col-tgl">' + displayTgl + '</td>' +
        '<td class="col-jam">' + (item.jam || '-') + '</td>' +
        '<td class="col-tugas">' + item.tugas + '</td>' +
        
        '<td class="col-penting">' +
          '<label class="chk-container chk-penting">' +
            '<input type="checkbox" ' + (item.isPenting ? 'checked' : '') + ' onchange="togglePenting(' + index + ', this.checked)">' +
            '<span class="checkmark"></span>' +
          '</label>' +
        '</td>' +
        
        '<td class="col-jenis" style="font-weight:800; color:' + (item.jenis === 'Rutin' ? 'var(--neon-cyan)' : 'var(--neon-gold)') + ';">' + item.jenis.toUpperCase() + '</td>' +
        
        '<td class="col-st-akan">' +
          '<label class="chk-container chk-akan">' +
            '<input type="checkbox" ' + (item.status === 'AKAN' ? 'checked' : '') + ' onchange="changeStatus(' + index + ', \'AKAN\')">' +
            '<span class="checkmark"></span>' +
          '</label>' +
        '</td>' +
        
        '<td class="col-st-sedang">' +
          '<label class="chk-container chk-sedang">' +
            '<input type="checkbox" ' + (item.status === 'SEDANG' ? 'checked' : '') + ' onchange="changeStatus(' + index + ', \'SEDANG\')">' +
            '<span class="checkmark"></span>' +
          '</label>' +
        '</td>' +
        
        '<td class="col-st-selesai">' +
          '<label class="chk-container chk-selesai">' +
            '<input type="checkbox" ' + (item.status === 'SELESAI' ? 'checked' : '') + ' onchange="changeStatus(' + index + ', \'SELESAI\')">' +
            '<span class="checkmark"></span>' +
          '</label>' +
        '</td>' +
        
        '<td class="col-ket">' + (item.keterangan || '-') + '</td>' +
        '<td class="col-action">' +
          '<div class="btn-action-group">' +
            '<button class="btn-icon btn-edit" onclick="enableInlineEdit(' + index + ')" title="Edit">' + iconPencil + '</button>' +
            '<button class="btn-icon btn-delete" onclick="deleteTask(' + index + ')" title="Hapus">' + iconTrash + '</button>' +
          '</div>' +
        '</td>';
    }

    tbody.appendChild(tr);
  });

  if (triggerSave) saveData();
}

function changeStatus(index, newStatus) {
  const oldStatus = systemTasks[index].status;
  
  if (oldStatus === newStatus) {
    systemTasks[index].status = 'AKAN';
  } else {
    systemTasks[index].status = newStatus;
    
    let statusText = 'akan dikerjakan';
    if (newStatus === 'SEDANG') statusText = 'sedang dikerjakan';
    if (newStatus === 'SELESAI') statusText = 'telah selesai';
    panggilSuaraAI('Pemberitahuan. Tugas ' + systemTasks[index].tugas + ' ' + statusText);
  }
  
  renderTasks(true);
}

function togglePenting(index, isChecked) {
  systemTasks[index].isPenting = isChecked;
  saveData();
}

function enableInlineEdit(index) {
  editingRowIndex = index;
  renderTasks(false);
}

function saveInlineEdit(index) {
  const tgl = document.getElementById('edit-tgl').value;
  const jam = document.getElementById('edit-jam').value;
  const tugas = document.getElementById('edit-tugas').value.trim();
  const isPenting = document.getElementById('edit-penting').value === 'ya';
  const jenis = document.getElementById('edit-jenis').value;
  const keterangan = document.getElementById('edit-keterangan').value.trim();

  if (!tgl || !tugas) return alert("Tanggal dan Tugas wajib diisi!");

  systemTasks[index] = { ...systemTasks[index], tgl, jam, tugas, isPenting, jenis, keterangan };
  editingRowIndex = -1;
  renderTasks(true);
}

function deleteTask(index) {
  if (confirm("Hapus tugas ini secara permanen dari database?")) {
    systemTasks.splice(index, 1);
    renderTasks(true);
  }
}

function addNewTask() {
  const tgl = document.getElementById('inputTgl').value;
  const jam = document.getElementById('inputJam').value;
  const tugas = document.getElementById('inputTugas').value.trim();
  const isPenting = document.getElementById('inputPenting').value === 'ya';
  const jenis = document.getElementById('inputJenis').value;
  const keterangan = document.getElementById('inputKeterangan').value.trim();

  if (!tgl || !tugas) return alert("Isi tanggal dan nama tugas!");

  systemTasks.push({
    tgl,
    jam,
    tugas,
    isPenting,
    jenis,
    status: 'AKAN',
    keterangan
  });

  renderTasks(true);

  document.getElementById('inputTugas').value = '';
  document.getElementById('inputKeterangan').value = '';
  toggleModal(false);
}

function toggleModal(show) {
  document.getElementById('settingModal').classList.toggle('active', show);
}

document.getElementById('inputTgl').valueAsDate = new Date();

setInterval(updateDateTime, 1000);
updateDateTime();
loadData();
setInterval(loadData, 10000);
</script>
</body>
</html>
